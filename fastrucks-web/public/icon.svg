<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Speed lines background subtle -->
  <path d="M60 140 H200 M40 180 H160 M80 220 H180" stroke="#10b981" stroke-width="8" stroke-linecap="round" opacity="0.4" />

  <!-- Heavy Freight Truck Graphic -->
  <g transform="translate(64, 110)" filter="url(#shadow)">
    <!-- Trailer Body -->
    <rect x="20" y="40" width="220" height="150" rx="12" fill="#ffffff" />
    <!-- Cargo Stripe -->
    <rect x="20" y="90" width="220" height="20" fill="url(#accentGrad)" />
    <!-- Fastrucks "F" mark on trailer -->
    <path d="M50 65 H110 M50 65 V130 M50 95 H95" stroke="#047857" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <text x="130" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#064e3b">FASTRUCKS</text>

    <!-- Cab Unit -->
    <path d="M245 80 L300 80 Q320 80 330 95 L355 135 Q365 150 365 165 L365 190 H245 Z" fill="#f8fafc" />
    <!-- Cab Window -->
    <path d="M260 95 H300 L330 135 H260 Z" fill="#0f172a" />
    <!-- Headlight -->
    <rect x="350" y="165" width="16" height="18" rx="4" fill="#fbbf24" />

    <!-- Wheels (Truck & Trailer) -->
    <!-- Rear Dual Axle -->
    <circle cx="65" cy="190" r="28" fill="#1e293b" />
    <circle cx="65" cy="190" r="14" fill="#94a3b8" />
    <circle cx="125" cy="190" r="28" fill="#1e293b" />
    <circle cx="125" cy="190" r="14" fill="#94a3b8" />

    <!-- Front Drive Axle -->
    <circle cx="315" cy="190" r="28" fill="#1e293b" />
    <circle cx="315" cy="190" r="14" fill="#94a3b8" />

    <!-- Chassis Line -->
    <rect x="20" y="180" width="345" height="10" fill="#334155" />
  </g>

  <!-- Speed Arrow / Logistics Emblem -->
  <g transform="translate(196, 360)">
    <rect x="-40" y="-18" width="200" height="36" rx="18" fill="url(#accentGrad)" />
    <text x="60" y="6" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0f172a" letter-spacing="1.5">KENYA LOGISTICS</text>
  </g>
</svg>
